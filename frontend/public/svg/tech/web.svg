<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 570" class="arch-svg" role="img" aria-labelledby="web-title">
<title id="web-title">Aerovia browser and deployment flow</title>
<style>svg .l-es{display:none}.lane{fill:var(--color-surface);stroke:var(--color-border)}.bx{fill:var(--color-surface-2,var(--color-surface));stroke:var(--color-border);stroke-width:1.3}.bx-hi{stroke:var(--color-accent)}.bx-eng{stroke:var(--color-good)}.bx-gate{stroke:var(--color-warn)}.ttl{font:600 13px sans-serif;fill:var(--color-fg)}.sub{font:11px sans-serif;fill:var(--color-fg-subtle)}.it{font:11px sans-serif;fill:var(--color-fg)}.cd{font:10px monospace;fill:var(--color-accent)}.mu{font:10px sans-serif;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.lbl{font:10px sans-serif;fill:var(--color-fg-subtle)}</style>
<defs><marker id="web-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="28" class="ttl l-en">A release is verified bytes; an interaction is a new local computation</text><text x="24" y="28" class="ttl l-es">Una versión son bytes verificados; una interacción es nuevo cálculo local</text>
<rect x="20" y="53" width="840" height="174" rx="8" class="lane"/><text x="34" y="78" class="sub l-en">BUILD AND DELIVERY</text><text x="34" y="78" class="sub l-es">CONSTRUCCIÓN Y ENTREGA</text>
<rect x="34" y="92" width="232" height="111" rx="6" class="bx bx-gate"/><text x="48" y="115" class="ttl l-en">Verify committed content</text><text x="48" y="115" class="ttl l-es">Verificar contenido registrado</text><text x="48" y="138" class="cd l-neutral">prepare-data.mjs</text><text x="48" y="163" class="it l-en">Schema, SHA-256, complete catalog</text><text x="48" y="163" class="it l-es">Esquema, SHA-256, catálogo completo</text><text x="48" y="186" class="mu l-en">No scientific regeneration on build</text><text x="48" y="186" class="mu l-es">Sin regeneración científica al construir</text>
<path d="M267 148H319" class="flow" marker-end="url(#web-arr)"/><text x="276" y="137" class="lbl l-en">copy</text><text x="276" y="137" class="lbl l-es">copiar</text>
<rect x="324" y="92" width="232" height="111" rx="6" class="bx bx-eng"/><text x="338" y="115" class="ttl l-en">Build the static application</text><text x="338" y="115" class="ttl l-es">Construir aplicación estática</text><text x="338" y="138" class="cd l-neutral">Vite · generate-manifest.mjs</text><text x="338" y="163" class="it l-en">Version, commit and asset identity</text><text x="338" y="163" class="it l-es">Versión, commit e identidad de activos</text><text x="338" y="186" class="mu l-en">Runtime files are individually hashed</text><text x="338" y="186" class="mu l-es">Cada archivo tiene hash individual</text>
<path d="M557 148H609" class="flow" marker-end="url(#web-arr)"/><text x="565" y="137" class="lbl l-en">deploy</text><text x="565" y="137" class="lbl l-es">publicar</text>
<rect x="614" y="92" width="232" height="111" rx="6" class="bx bx-hi"/><text x="628" y="115" class="ttl l-en">Public HTTPS surface</text><text x="628" y="115" class="ttl l-es">Superficie pública HTTPS</text><text x="628" y="138" class="cd l-neutral">GitHub Pages · CNAME</text><text x="628" y="163" class="it l-en">Custom domain; no visitor account</text><text x="628" y="163" class="it l-es">Dominio propio; sin cuenta de visitante</text><text x="628" y="186" class="mu l-en">Static assets, no remote solver</text><text x="628" y="186" class="mu l-es">Activos estáticos, sin motor remoto</text>
<path d="M730 204V263" class="flow" marker-end="url(#web-arr)"/><text x="739" y="247" class="lbl l-neutral">HTTPS GET</text>
<rect x="20" y="272" width="840" height="194" rx="8" class="lane"/><text x="34" y="297" class="sub l-en">BROWSER SESSION</text><text x="34" y="297" class="sub l-es">SESIÓN DEL NAVEGADOR</text>
<rect x="34" y="311" width="232" height="132" rx="6" class="bx bx-hi"/><text x="48" y="335" class="ttl l-en">Render a coherent model state</text><text x="48" y="335" class="ttl l-es">Dibujar estado coherente</text><text x="48" y="358" class="cd l-neutral">scene/ · workbench/ · pages/</text><text x="48" y="383" class="it l-en">Selection links scene and values</text><text x="48" y="383" class="it l-es">Selección vincula escena y valores</text><text x="48" y="407" class="it l-en">Failure and pending states are visible</text><text x="48" y="407" class="it l-es">Fallo y espera son estados visibles</text><text x="48" y="429" class="mu l-en">EN / ES, themes, keyboard alternatives</text><text x="48" y="429" class="mu l-es">EN / ES, temas, alternativas de teclado</text>
<path d="M319 379H272" class="flow" marker-end="url(#web-arr)"/><text x="274" y="365" class="lbl l-en">result</text><text x="274" y="365" class="lbl l-es">salida</text>
<rect x="324" y="311" width="232" height="132" rx="6" class="bx bx-eng"/><text x="338" y="335" class="ttl l-en">Local numerical work</text><text x="338" y="335" class="ttl l-es">Cálculo numérico local</text><text x="338" y="358" class="cd l-neutral">engine/worker.ts</text><text x="338" y="383" class="it l-en">Immutable request snapshot + identity</text><text x="338" y="383" class="it l-es">Instantánea inmutable e identidad</text><text x="338" y="407" class="it l-en">Physical checks before dependent views</text><text x="338" y="407" class="it l-es">Control físico antes de vistas derivadas</text><text x="338" y="429" class="mu l-en">Stale replies cannot replace new input</text><text x="338" y="429" class="mu l-es">Respuesta vieja no sustituye entrada nueva</text>
<path d="M609 379H562" class="flow" marker-end="url(#web-arr)"/><text x="564" y="365" class="lbl l-en">request</text><text x="564" y="365" class="lbl l-es">solicitud</text>
<rect x="614" y="311" width="232" height="132" rx="6" class="bx bx-hi"/><text x="628" y="335" class="ttl l-en">Shared shell and active project</text><text x="628" y="335" class="ttl l-es">Shell y proyecto activo</text><text x="628" y="358" class="cd l-neutral">main.tsx · storage.ts</text><text x="628" y="383" class="it l-en">Load, edit, save, undo and compare</text><text x="628" y="383" class="it l-es">Cargar, editar, guardar y comparar</text><text x="628" y="407" class="it l-en">Six routes; architecture always reachable</text><text x="628" y="407" class="it l-es">Seis rutas y arquitectura accesible</text><text x="628" y="429" class="mu l-en">Source files and projects stay local</text><text x="628" y="429" class="mu l-es">Archivos y proyectos permanecen locales</text>
<rect x="34" y="499" width="812" height="51" rx="6" class="bx bx-gate"/><text x="48" y="520" class="cd l-neutral">verify-deployment.mjs · Playwright · monitor.yml</text><text x="48" y="540" class="it l-en">Verify actual served bytes, then exercise the real interactions after deployment.</text><text x="48" y="540" class="it l-es">Verificar bytes servidos y después ejercitar interacciones reales tras publicar.</text>
</svg>
