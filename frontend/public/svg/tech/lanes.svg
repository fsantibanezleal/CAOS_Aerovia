<rect x="324" y="94" width="232" height="159" rx="6" class="bx bx-gate"/><text x="338" y="119" class="ttl l-en">Catalog and uncertainty</text><text x="338" y="119" class="ttl l-es">Catálogo e incertidumbre</text><text x="338" y="143" class="cd l-neutral">data/artifacts/catalog.json</text><text x="338" y="163" class="cd l-neutral">data/artifacts/manifest.json</text><text x="338" y="190" class="it l-en">Network + options + output arrays</text><text x="338" y="190" class="it l-es">Red, opciones y arreglos de salida</text><text x="338" y="213" class="it l-en">SHA-256 + SI equation acceptance</text><text x="338" y="213" class="it l-es">SHA-256 y aceptación de ecuaciones</text><text x="338" y="237" class="mu l-en">Edits invalidate unmatched evidence</text><text x="338" y="237" class="mu l-es">Editar invalida evidencia no coincidente</text>
