<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 610" class="arch-svg" role="img" aria-labelledby="lanes-title">
<title id="lanes-title">Aerovia execution lanes</title>
<style>svg .l-es{display:none}.lane{fill:var(--color-surface);stroke:var(--color-border)}.bx{fill:var(--color-surface-2,var(--color-surface));stroke:var(--color-border);stroke-width:1.3}.bx-hi{stroke:var(--color-accent)}.bx-eng{stroke:var(--color-good)}.bx-gate{stroke:var(--color-warn)}.ttl{font:600 13px sans-serif;fill:var(--color-fg)}.sub{font:11px sans-serif;fill:var(--color-fg-subtle)}.it{font:11px sans-serif;fill:var(--color-fg)}.cd{font:10px monospace;fill:var(--color-accent)}.mu{font:10px sans-serif;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.lbl{font:10px sans-serif;fill:var(--color-fg-subtle)}</style>
<defs><marker id="lane-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="28" class="ttl l-en">Execution location is part of the result's meaning</text><text x="24" y="28" class="ttl l-es">El lugar de ejecución es parte del significado del resultado</text>
<rect x="20" y="48" width="260" height="452" rx="8" class="lane"/><rect x="310" y="48" width="260" height="452" rx="8" class="lane"/><rect x="600" y="48" width="260" height="452" rx="8" class="lane"/>
<text x="36" y="75" class="ttl l-en">LOCAL CPU / GPU</text><text x="36" y="75" class="ttl l-es">CPU / GPU LOCAL</text><text x="326" y="75" class="ttl l-en">VERIFIED REPLAY</text><text x="326" y="75" class="ttl l-es">EVIDENCIA VERIFICADA</text><text x="616" y="75" class="ttl l-en">LIVE BROWSER</text><text x="616" y="75" class="ttl l-es">NAVEGADOR EN VIVO</text>
<rect x="34" y="94" width="232" height="159" rx="6" class="bx bx-eng"/><text x="48" y="119" class="ttl l-en">Canonical numerical work</text><text x="48" y="119" class="ttl l-es">Cálculo numérico canónico</text><text x="48" y="143" class="cd l-neutral">aerovia_pipeline/model.py</text><text x="48" y="163" class="cd l-neutral">aerovia_pipeline/ensemble.py</text><text x="48" y="190" class="it l-en">SciPy reference · float64 CUDA</text><text x="48" y="190" class="it l-es">Referencia SciPy · CUDA float64</text><text x="48" y="213" class="it l-en">Draws, seeds, exact residual checks</text><text x="48" y="213" class="it l-es">Realizaciones, semillas y residuos</text><text x="48" y="237" class="mu l-en">Offline computation is explicit</text><text x="48" y="237" class="mu l-es">El cálculo local es explícito</text>
<rect x="34" y="290" width="232" height="178" rx="6" class="bx bx-eng"/><text x="48" y="315" class="ttl l-en">Train and evaluate</text><text x="48" y="315" class="ttl l-es">Entrenar y evaluar</text><text x="48" y="339" class="cd l-neutral">surrogate_data.py</text><text x="48" y="359" class="cd l-neutral">surrogate_models.py</text><text x="48" y="385" class="it l-en">Split before fitting; select once</text><text x="48" y="385" class="it l-es">Separar antes; seleccionar una vez</text><text x="48" y="407" class="it l-en">MLP + shared graph weights</text><text x="48" y="407" class="it l-es">MLP y pesos de grafo compartidos</text><text x="48" y="446" class="mu l-en">Actual checkpoints + held-out metrics</text><text x="48" y="446" class="mu l-es">Checkpoints reales y prueba reservada</text>
