<rect x="324" y="290" width="232" height="178" rx="6" class="bx bx-gate"/><text x="338" y="315" class="ttl l-en">Scientific model evidence</text><text x="338" y="315" class="ttl l-es">Evidencia de modelos</text><text x="338" y="339" class="cd l-neutral">science.json · registry.json</text><text x="338" y="366" class="it l-en">Same-input prediction comparisons</text><text x="338" y="366" class="it l-es">Comparación con mismas entradas</text><text x="338" y="389" class="it l-en">Domain bounds + output provenance</text><text x="338" y="389" class="it l-es">Dominio y procedencia de salida</text><text x="338" y="414" class="it l-en">Browser export parity is separate</text><text x="338" y="414" class="it l-es">Concordancia de navegador separada</text><text x="338" y="446" class="mu l-en">Missing evidence stays unavailable</text><text x="338" y="446" class="mu l-es">Evidencia ausente no se fabrica</text>
<path d="M557 175H609" class="flow" marker-end="url(#lane-arr)"/><text x="568" y="162" class="lbl l-en">read</text><text x="568" y="162" class="lbl l-es">leer</text>
<rect x="614" y="94" width="232" height="159" rx="6" class="bx bx-hi"/><text x="628" y="119" class="ttl l-en">Exact bounded domain tools</text><text x="628" y="119" class="ttl l-es">Herramientas exactas acotadas</text><text x="628" y="143" class="cd l-neutral">engine/solver.ts</text><text x="628" y="163" class="cd l-neutral">transport.ts · routing.ts</text><text x="628" y="190" class="it l-en">Edit → solve → inspect quantities</text><text x="628" y="190" class="it l-es">Editar → resolver → inspeccionar</text><text x="628" y="213" class="it l-en">Local worker; bounded workloads</text><text x="628" y="213" class="it l-es">Trabajador local; carga acotada</text><text x="628" y="237" class="mu l-en">No user-data upload is required</text><text x="628" y="237" class="mu l-es">No requiere subir datos del usuario</text>
<path d="M557 378H609" class="flow" marker-end="url(#lane-arr)"/><text x="567" y="365" class="lbl l-en">load</text><text x="567" y="365" class="lbl l-es">cargar</text>
<rect x="614" y="290" width="232" height="178" rx="6" class="bx bx-hi"/><text x="628" y="315" class="ttl l-en">Approximate live inference</text><text x="628" y="315" class="ttl l-es">Inferencia aproximada en vivo</text><text x="628" y="339" class="cd l-neutral">ONNX Runtime · learned/</text><text x="628" y="366" class="it l-en">Registered topology + bounded inputs</text><text x="628" y="366" class="it l-es">Topología registrada y límites</text><text x="628" y="389" class="it l-en">Raw + projected flow and error</text><text x="628" y="389" class="it l-es">Caudal crudo, proyectado y error</text><text x="628" y="414" class="it l-en">Exact solver remains a comparison</text><text x="628" y="414" class="it l-es">Solucionador exacto para comparar</text><text x="628" y="446" class="mu l-en">Runtime failure is an explicit state</text><text x="628" y="446" class="mu l-es">Fallo de ejecución es estado explícito</text>
<rect x="34" y="532" width="812" height="53" rx="6" class="bx bx-gate"/><text x="48" y="555" class="ttl l-en">Publishing copies verified artifacts; it never trains or rebakes scientific results</text><text x="48" y="555" class="ttl l-es">Publicar copia artefactos verificados; nunca entrena ni recalcula resultados científicos</text><text x="48" y="574" class="mu l-en">Execution lanes are disclosed separately from numerical and field-validation claims.</text><text x="48" y="574" class="mu l-es">Las vías de ejecución se declaran separadas de verificación numérica y validación de terreno.</text>
</svg>
