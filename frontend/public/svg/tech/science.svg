<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 670" class="arch-svg" role="img" aria-labelledby="science-title">
<title id="science-title">Aerovia scientific algorithms</title>
<style>svg .l-es{display:none}.lane{fill:var(--color-surface);stroke:var(--color-border)}.bx{fill:var(--color-surface-2,var(--color-surface));stroke:var(--color-border);stroke-width:1.3}.bx-hi{stroke:var(--color-accent)}.bx-eng{stroke:var(--color-good)}.bx-gate{stroke:var(--color-warn)}.ttl{font:600 13px sans-serif;fill:var(--color-fg)}.sub{font:11px sans-serif;fill:var(--color-fg-subtle)}.it{font:11px sans-serif;fill:var(--color-fg)}.cd{font:10px monospace;fill:var(--color-accent)}.mu{font:10px sans-serif;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.lbl{font:10px sans-serif;fill:var(--color-fg-subtle)}</style>
<defs><marker id="sci-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="28" class="ttl l-en">Different scientific questions share one explicit physical network</text><text x="24" y="28" class="ttl l-es">Preguntas científicas distintas comparten una red física explícita</text>
<rect x="30" y="55" width="820" height="111" rx="6" class="bx bx-hi"/><text x="46" y="81" class="ttl l-en">Signed turbulent network · constant density · fixed pressure boundaries</text><text x="46" y="81" class="ttl l-es">Red turbulenta con signo · densidad constante · presiones fijas</text><text x="46" y="107" class="cd l-neutral">engine/solver.ts · aerovia_pipeline/model.py</text><text x="46" y="132" class="it l-neutral">BᵢQ = 0     Δp + H₀s² − (R + k)Q|Q| = 0     u = Q/A</text><text x="46" y="152" class="mu l-en">R is supplied; geometry does not secretly recalibrate it.</text><text x="46" y="152" class="mu l-es">R es suministrada; geometría no la recalibra silenciosamente.</text>
<path d="M176 167V208" class="flow" marker-end="url(#sci-arr)"/><path d="M440 167V208" class="flow" marker-end="url(#sci-arr)"/><path d="M704 167V208" class="flow" marker-end="url(#sci-arr)"/><text x="185" y="193" class="lbl l-en">solve</text><text x="185" y="193" class="lbl l-es">resolver</text><text x="449" y="193" class="lbl l-en">perturb</text><text x="449" y="193" class="lbl l-es">perturbar</text><text x="713" y="193" class="lbl l-en">learn</text><text x="713" y="193" class="lbl l-es">aprender</text>
<rect x="30" y="218" width="252" height="166" rx="6" class="bx bx-eng"/><text x="45" y="243" class="ttl l-en">Exact numerical engines</text><text x="45" y="243" class="ttl l-es">Motores numéricos exactos</text><text x="45" y="266" class="cd l-neutral">solver.ts · model.py</text><text x="45" y="291" class="it l-en">Browser: nodal Newton continuation</text><text x="45" y="291" class="it l-es">Navegador: Newton nodal continuado</text><text x="45" y="315" class="it l-en">Reference: mixed SciPy trust region</text><text x="45" y="315" class="it l-es">Referencia: región de confianza mixta</text><text x="45" y="338" class="it l-neutral">rₘ ≤ 10⁻⁶ m³/s · rₚ ≤ 10⁻⁵ Pa</text><text x="45" y="366" class="mu l-en">Fan regime must also be supported</text><text x="45" y="366" class="mu l-es">Ventilador también debe ser soportado</text>
<rect x="314" y="218" width="252" height="166" rx="6" class="bx bx-eng"/><text x="329" y="243" class="ttl l-en">Resistance ensembles</text><text x="329" y="243" class="ttl l-es">Conjuntos de resistencia</text><text x="329" y="266" class="cd l-neutral">ensemble.py</text><text x="329" y="291" class="it l-neutral">Rʲ = R exp(σZʲ − σ²/2)</text><text x="329" y="315" class="it l-en">Seeded same-input CPU / CUDA</text><text x="329" y="315" class="it l-es">CPU / CUDA con entradas idénticas</text><text x="329" y="338" class="it l-en">Quantiles + target fraction + failures</text><text x="329" y="338" class="it l-es">Cuantiles, fracción objetivo y fallos</text><text x="329" y="366" class="mu l-en">Assumed distribution, not field risk</text><text x="329" y="366" class="mu l-es">Distribución supuesta, no riesgo real</text>
<rect x="598" y="218" width="252" height="166" rx="6" class="bx bx-gate"/><text x="613" y="243" class="ttl l-en">Approximate learned response</text><text x="613" y="243" class="ttl l-es">Respuesta aprendida aproximada</text><text x="613" y="266" class="cd l-neutral">surrogate_models.py</text><text x="613" y="291" class="it l-en">MLP 128 × 2 · graph 32 × 4</text><text x="613" y="291" class="it l-es">MLP 128 × 2 · grafo 32 × 4</text><text x="613" y="315" class="it l-en">Raw → conservation projection</text><text x="613" y="315" class="it l-es">Crudo → proyección conservativa</text><text x="613" y="338" class="it l-en">Pressure reconstruction + residuals</text><text x="613" y="338" class="it l-es">Reconstrucción de presión y residuos</text><text x="613" y="366" class="mu l-en">Compare on same held-out inputs</text><text x="613" y="366" class="mu l-es">Comparar mismas entradas reservadas</text>
<path d="M154 385V426" class="flow" marker-end="url(#sci-arr)"/><path d="M154 399H439V426" class="flow" marker-end="url(#sci-arr)"/><path d="M439 385V392H724" class="flow"/><path d="M724 385V426" class="flow" marker-end="url(#sci-arr)"/><text x="51" y="416" class="lbl l-en">flows</text><text x="51" y="416" class="lbl l-es">caudales</text><text x="252" y="418" class="lbl l-en">operating state</text><text x="252" y="418" class="lbl l-es">estado operativo</text><text x="544" y="418" class="lbl l-en">distributions + predictions</text><text x="544" y="418" class="lbl l-es">distribuciones y predicciones</text>
<rect x="30" y="437" width="252" height="166" rx="6" class="bx bx-eng"/><text x="45" y="462" class="ttl l-en">Passive tracer and routing</text><text x="45" y="462" class="ttl l-es">Trazador pasivo y rutas</text><text x="45" y="485" class="cd l-neutral">transport.ts · routing.ts</text><text x="45" y="510" class="it l-neutral">dm/dt = Fᵢₙ − Fₒᵤₜ + S − λm</text><text x="45" y="534" class="it l-neutral">V = AL/N · τ = AL/|Q|</text><text x="45" y="558" class="it l-en">SSPRK2 · CFL 0.45 · mass ledger</text><text x="45" y="558" class="it l-es">SSPRK2 · CFL 0,45 · balance de masa</text><text x="45" y="585" class="mu l-en">No fire, toxicology or evacuation claim</text><text x="45" y="585" class="mu l-es">Sin incendio, toxicología ni evacuación</text>
<rect x="314" y="437" width="252" height="166" rx="6" class="bx bx-eng"/><text x="329" y="462" class="ttl l-en">Fan controls and interventions</text><text x="329" y="462" class="ttl l-es">Control e intervenciones</text><text x="329" y="485" class="cd l-neutral">engine/analysis.ts</text><text x="329" y="510" class="it l-en">26-step feasible-speed bisection</text><text x="329" y="510" class="it l-es">26 bisecciones de velocidad factible</text><text x="329" y="534" class="it l-en">21 solved operating-envelope points</text><text x="329" y="534" class="it l-es">21 puntos de envolvente resueltos</text><text x="329" y="558" class="it l-en">One-at-a-time +5% resistance change</text><text x="329" y="558" class="it l-es">Cambio individual de resistencia +5%</text><text x="329" y="585" class="mu l-en">Common speed, not global redesign</text><text x="329" y="585" class="mu l-es">Velocidad común, no rediseño global</text>
<rect x="598" y="437" width="252" height="166" rx="6" class="bx bx-gate"/><text x="613" y="462" class="ttl l-en">Independent evidence checks</text><text x="613" y="462" class="ttl l-es">Controles independientes</text><text x="613" y="485" class="cd l-neutral">tests/ · Benchmark.tsx</text><text x="613" y="510" class="it l-en">Analytic limits and conserved quantities</text><text x="613" y="510" class="it l-es">Límites analíticos y conservación</text><text x="613" y="534" class="it l-en">Raw error, residual and domain status</text><text x="613" y="534" class="it l-es">Error crudo, residuo y estado de dominio</text><text x="613" y="558" class="it l-en">Reference and learned lanes separated</text><text x="613" y="558" class="it l-es">Referencia y aprendizaje separados</text><text x="613" y="585" class="mu l-en">Numerical checks are not mine surveys</text><text x="613" y="585" class="mu l-es">Verificar no equivale a medir una mina</text>
<text x="30" y="640" class="sub l-en">Every downstream tool names its own state, units, assumptions and failure conditions.</text><text x="30" y="640" class="sub l-es">Cada herramienta derivada declara estado, unidades, supuestos y condiciones de fallo.</text>
</svg>
