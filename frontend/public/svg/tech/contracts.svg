<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 610" class="arch-svg" role="img" aria-labelledby="contracts-title">
<title id="contracts-title">Aerovia data contracts and evidence gates</title>
<style>svg .l-es{display:none}.lane{fill:var(--color-surface);stroke:var(--color-border)}.bx{fill:var(--color-surface-2,var(--color-surface));stroke:var(--color-border);stroke-width:1.3}.bx-hi{stroke:var(--color-accent)}.bx-eng{stroke:var(--color-good)}.bx-gate{stroke:var(--color-warn)}.ttl{font:600 13px sans-serif;fill:var(--color-fg)}.sub{font:11px sans-serif;fill:var(--color-fg-subtle)}.it{font:11px sans-serif;fill:var(--color-fg)}.cd{font:10px monospace;fill:var(--color-accent)}.mu{font:10px sans-serif;fill:var(--color-fg-subtle)}.flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.lbl{font:10px sans-serif;fill:var(--color-fg-subtle)}</style>
<defs><marker id="contract-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="28" class="ttl l-en">Two scientific contracts and explicit gates preserve provenance</text><text x="24" y="28" class="ttl l-es">Dos contratos científicos y controles explícitos conservan procedencia</text>
<rect x="22" y="54" width="382" height="199" rx="8" class="lane"/><text x="38" y="79" class="ttl l-en">INGESTION CONTRACT</text><text x="38" y="79" class="ttl l-es">CONTRATO DE ENTRADA</text>
<rect x="38" y="96" width="350" height="140" rx="6" class="bx bx-hi"/><text x="53" y="120" class="cd l-neutral">contracts.ts · network.schema.json</text><text x="53" y="146" class="it l-en">Nodes: identity, x/y/z, fixed-pressure boundary</text><text x="53" y="146" class="it l-es">Nodos: identidad, x/y/z, presión fija</text><text x="53" y="169" class="it l-en">Airways: endpoints, R, A, target, role, fan curve</text><text x="53" y="169" class="it l-es">Galerías: extremos, R, A, objetivo, rol, curva</text><text x="53" y="192" class="it l-en">Source kind, source description and license</text><text x="53" y="192" class="it l-es">Tipo de origen, descripción y licencia</text><text x="53" y="216" class="mu l-en">Full SI validation precedes replacing the active project</text><text x="53" y="216" class="mu l-es">Validación SI completa antes de reemplazar proyecto activo</text>
<path d="M405 158H469" class="flow" marker-end="url(#contract-arr)"/><text x="414" y="143" class="lbl l-en">compute</text><text x="414" y="143" class="lbl l-es">calcular</text>
<rect x="476" y="54" width="382" height="199" rx="8" class="lane"/><text x="492" y="79" class="ttl l-en">RESULT CONTRACT</text><text x="492" y="79" class="ttl l-es">CONTRATO DE RESULTADO</text>
<rect x="492" y="96" width="350" height="140" rx="6" class="bx bx-eng"/><text x="507" y="120" class="cd l-neutral">aerovia.result/v1 · catalog.json</text><text x="507" y="146" class="it l-en">Input + options identities; method and execution lane</text><text x="507" y="146" class="it l-es">Identidades de entrada/opciones; método y ejecución</text><text x="507" y="169" class="it l-en">Flow, pressure, velocity, power and target deficit</text><text x="507" y="169" class="it l-es">Caudal, presión, velocidad, potencia y déficit</text><text x="507" y="192" class="it l-en">Convergence, SI residuals, actual runtime metadata</text><text x="507" y="192" class="it l-es">Convergencia, residuos SI y metadatos reales</text><text x="507" y="216" class="mu l-en">A finite learned tensor is not exact-solver convergence</text><text x="507" y="216" class="mu l-es">Tensor aprendido finito no es convergencia exacta</text>
<path d="M212 254V297 M666 254V297" class="flow" marker-end="url(#contract-arr)"/><text x="221" y="283" class="lbl l-en">identify</text><text x="221" y="283" class="lbl l-es">identificar</text><text x="675" y="283" class="lbl l-en">verify</text><text x="675" y="283" class="lbl l-es">verificar</text>
<rect x="30" y="310" width="252" height="165" rx="6" class="bx bx-gate"/><text x="45" y="335" class="ttl l-en">Physical compatibility gate</text><text x="45" y="335" class="ttl l-es">Compatibilidad física</text><text x="45" y="359" class="cd l-neutral">validation.ts · learned/</text><text x="45" y="385" class="it l-en">Open pressure-connected graph</text><text x="45" y="385" class="it l-es">Grafo abierto conectado a presión</text><text x="45" y="409" class="it l-en">Registered learned topology + bounds</text><text x="45" y="409" class="it l-es">Topología aprendida y límites</text><text x="45" y="451" class="mu l-en">No silent clipping or new anchors</text><text x="45" y="451" class="mu l-es">Sin recorte ni anclajes silenciosos</text>
<rect x="314" y="310" width="252" height="165" rx="6" class="bx bx-gate"/><text x="329" y="335" class="ttl l-en">Case × regime × method coverage</text><text x="329" y="335" class="ttl l-es">Cobertura caso × régimen × método</text><text x="329" y="359" class="cd l-neutral">surrogate_data.py · science.json</text><text x="329" y="385" class="it l-en">Twelve authored engineering networks</text><text x="329" y="385" class="it l-es">Doce redes de ingeniería creadas</text><text x="329" y="409" class="it l-en">Six exact physical regimes per case</text><text x="329" y="409" class="it l-es">Seis regímenes físicos por caso</text><text x="329" y="451" class="mu l-en">Missing or failed cells remain explicit</text><text x="329" y="451" class="mu l-es">Celdas ausentes o fallidas explícitas</text>
<rect x="598" y="310" width="252" height="165" rx="6" class="bx bx-gate"/><text x="613" y="335" class="ttl l-en">Artifact and live parity gate</text><text x="613" y="335" class="ttl l-es">Control de artefacto y concordancia</text><text x="613" y="359" class="cd l-neutral">manifest.json · tests/</text><text x="613" y="385" class="it l-en">Hashes, schema, residuals and counts</text><text x="613" y="385" class="it l-es">Hashes, esquema, residuos y cantidad</text><text x="613" y="409" class="it l-en">Independent same-input comparisons</text><text x="613" y="409" class="it l-es">Comparaciones independientes iguales</text><text x="613" y="451" class="mu l-en">No manufactured fallback metrics</text><text x="613" y="451" class="mu l-es">Sin métricas alternativas fabricadas</text>
<path d="M156 476V505H440 M724 476V505H440 M440 476V516" class="flow" marker-end="url(#contract-arr)"/><text x="452" y="500" class="lbl l-en">release gate</text><text x="452" y="500" class="lbl l-es">control de publicación</text>
<rect x="30" y="527" width="820" height="59" rx="6" class="bx bx-hi"/><text x="45" y="551" class="ttl l-en">An exported project is reviewable because the assumptions travel with the outputs</text><text x="45" y="551" class="ttl l-es">El proyecto exportado se puede revisar porque supuestos y salidas viajan juntos</text><text x="45" y="574" class="mu l-en">Provenance distinguishes authored scenarios, imported input, exact solutions and approximations.</text><text x="45" y="574" class="mu l-es">Procedencia distingue escenarios creados, datos importados, soluciones exactas y aproximaciones.</text>
</svg>
