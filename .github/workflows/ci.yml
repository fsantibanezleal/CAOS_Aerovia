name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# ADR-0074: cheap checks on committed files, on the trunk branches only. The build, the unit tests, the browser journeys and
# the numerical verification run in deploy-pages.yml; this workflow holds the template's general guards, so a guard
# failure shows on its own and the build is not repeated.
# Every step runs under `bash -eo pipefail`, so a failing command inside a pipe fails the step (T9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version check compares VERSION with the latest tag
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the web dependencies (the SVG guard and the web baseline read the installed shell)
        run: cd frontend && npm ci
      - name: The workflows parse
        run: |
          pip install pyyaml==6.0.3
          python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]; print('workflows: OK')"
      - name: VERSION is the single source (T4)
        run: python scripts/check_version_coherence.py
      - name: One deploy place
        run: python scripts/check_deploy_place.py
      - name: An animated SVG carries its reduced-motion block and plays ten seconds at most (shell 0.14.0, reuses the shell's analysis)
        run: python scripts/check_svg_animation.py
      - name: Web baseline (tokens, classes, numbers, images, animation loops)
        run: python scripts/check_web_baseline.py

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          # the tracked paths, read once. `git ls-files | grep -q` failed at random under pipefail: grep -q exits on its first
          # match, git ls-files dies of SIGPIPE and the pipeline reports 141, so a test (and its negation) flipped run to run.
          # Every test below reads the list from a here-string: no pipe, no early-closing reader.
          files="$(git ls-files)"
          # a real .env must never be tracked; an example file (.env.example, frontend/.env.example) may be
          envs="$(grep -E '(^|/)\.env(\..+)?$' <<<"$files" | grep -vE '(^|/)\.env(\..+)?\.example$' || true)"
          if [ -n "$envs" ]; then
            echo "::error::a real .env is tracked (only an .env.example may be): $(tr '\n' ' ' <<<"$envs")"; fail=1; fi
          # venvs, native binaries and heavy model blobs must never be tracked. The product's own trained checkpoints are
          # compact (14 files, 1.6 MB) and committed by design under data/models/, with their checksums in the model
          # manifest; that folder is the one exemption (a deviation from the template's step, decision recorded in the
          # base-wiring report).
          blobs="$(grep -iE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$' <<<"$files" | grep -vE '^data/models/.*\.pt$' || true)"
          if [ -n "$blobs" ]; then
            echo "::error::a venv or native/heavy binary is tracked"; fail=1; fi
          # raw or heavy data must never be tracked; commit only compact derived artifacts under data/derived/
          if grep -qiE '\.(parquet|h5|hdf5|nc|mat|npy)$' <<<"$files"; then
            echo "::error::raw or heavy data tracked; commit only compact derived artifacts (data/derived/)"; fail=1; fi
          # no leaked local machine paths in tracked sources
          if git grep -nE '[A-Z]:\_(Repos|worktrees|Temp)|[A-Z]:/_(Repos|worktrees|Temp)' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::a local machine path in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: No template residue (an instantiated product replaces the example)
        run: python scripts/check_template_residue.py
      - name: Every path a document names exists
        run: python scripts/check_doc_paths.py
      - name: No em-dash or emoji in product content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: CI budget, no training, trunk-only triggers (ADR-0074)
        run: python scripts/check_ci_budget.py
