name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# ADR-0074: cheap checks on committed files, on the trunk branches only. The build, the unit tests, the browser journeys and
# the numerical verification run in deploy-pages.yml; this workflow holds the template's general guards, so a guard
# failure shows on its own and the build is not repeated.
# Every step runs under `bash -eo pipefail`, so a failing command inside a pipe fails the step (T9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version check compares VERSION with the latest tag
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the web dependencies (the SVG guard and the web baseline read the installed shell)
        run: cd frontend && npm ci
      - name: Install the schema validator and numpy and scipy (the SDD guard and the planted-defect suite; test_runtime.py imports the pipeline)
        run: pip install jsonschema==4.26.0 numpy==2.5.3 scipy==1.18.1
      - name: The workflows parse
        run: |
          pip install pyyaml==6.0.3
          python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]; print('workflows: OK')"
      - name: VERSION is the single source (T4)
        run: python scripts/check_version_coherence.py
      - name: One deploy place
        run: python scripts/check_deploy_place.py
      - name: An animated SVG carries its reduced-motion block and plays ten seconds at most (shell 0.14.0, reuses the shell's analysis)
        run: python scripts/check_svg_animation.py
      - name: Web baseline (tokens, classes, numbers, images, animation loops)
        run: python scripts/check_web_baseline.py
      - name: Contract versions follow their schemas, each with its History entry, against the base (ADR-0080)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "${base//0/}" ]; then base=origin/develop; fi  # a new branch or a manual run has no before SHA
          python scripts/check_contract_versions.py --base "$base"
      - name: Every guard rejects a planted defect (spec area, cheap, standard library and pytest only)
        run: pip install pytest==9.1.1 && python -m pytest tests/adversarial -q
      - name: The contract catalog, every row complete and every path it names present (ADR-0080)
        run: python scripts/check_contracts.py docs/contracts/catalog.md --repo-root .
      - name: The readiness document is current with the catalog and the committed evidence (ADR-0080)
        run: python scripts/check_readiness.py
      - name: Every committed document valid against its schema file (ADR-0080)
        run: pip install jsonschema==4.26.0 && python scripts/check_documents.py
      - name: The SDD technology table is the pinned dependencies (spec area)
        run: python scripts/check_tech_matrix.py
      - name: The SDD, every requirement with a real gate (ADR-0075)
        run: python scripts/check_sdd.py
      - name: Rows still served by a provider (listed while building; none on main)
        run: |
          set +e
          python scripts/check_skeleton.py docs/contracts/catalog.md
          code=$?
          set -e
          if [ "$code" -eq 2 ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::main is a release: every catalog row must be real"; exit 1; fi
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Base-integrity guards (the regressions this archetype forbids; the committed models are declared in the contract catalog, ADR-0080)
        run: python scripts/check_base_integrity.py
      - name: No template residue (an instantiated product replaces the example)
        run: python scripts/check_template_residue.py
      - name: Every path a document names exists
        run: python scripts/check_doc_paths.py
      - name: No em-dash or emoji in product content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: CI budget, no training, trunk-only triggers (ADR-0074)
        run: python scripts/check_ci_budget.py
