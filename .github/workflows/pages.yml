name: Verify and publish Pages

on:
  push:
    branches: [main, develop, 'task/**', 'work/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aerovia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify public source, physics, browser and release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history for public-source audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install reference solver dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit public files and history
        run: |
          python scripts/check_public_safety.py --history
          python scripts/check_content_standards.py
          python scripts/check_template_residue.py
      - name: Require runnable POSIX scripts
        shell: bash
        run: |
          invalid_modes="$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')"
          if [[ -n "$invalid_modes" ]]; then
            printf 'Scripts missing executable Git mode:\n%s\n' "$invalid_modes"
            exit 1
          fi
          for script in scripts/local/*.sh; do bash -n "$script"; done
      - name: Test independent numerical reference and data contract
        run: python -m pytest tests/python -q
      - name: Validate committed networks
        run: python scripts/pipeline.py validate --input data/cases.json
      - name: Verify committed artifact hashes and numerical evidence
        run: python scripts/pipeline.py verify --artifacts data/artifacts --input data/cases.json
      - name: Install browser dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test browser solver and operations
        working-directory: frontend
        run: npm test
      - name: Build verified static release
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise rendered user journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-verification-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Confirm validation did not rewrite canonical scientific data
        run: git diff --exit-code -- data
      - name: Upload static release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    name: Publish verified release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
